<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salut, sunt Teo 🔥</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff1493, #8a2be2, #ff00ff);
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(0, 0, 0, 0.5);
            padding: 50px 40px;
            border-radius: 30px;
            box-shadow: 0 0 50px rgba(255, 20, 147, 0.9);
            max-width: 650px;
        }
        h1 {
            font-size: 3.8rem;
            margin: 0 0 25px 0;
            text-shadow: 0 0 20px #fff;
        }
        p {
            font-size: 1.9rem;
            margin: 18px 0;
            line-height: 1.5;
        }
        .big {
            font-size: 2.4rem;
            font-weight: bold;
        }
        .heart {
            font-size: 4.5rem;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }
        .fire {
            font-size: 3rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Salut! 🔥</h1>
        
        <p><strong>Sunt Teo</strong></p>
        <p class="big">Sunt Gay 🏳️‍🌈</p>
        
        <p>Și îmi place de <strong>Darius</strong> foarte mult... ❤️</p>
        
        <p class="big" style="margin: 35px 0;">
            Mă fut cu lumea<br>
            Îmi place să o iau <span class="fire">🍆</span> și să dau <span class="fire">🍑</span>
        </p>
        
        <p>Darius e fix genul meu... <br>
        Vreau să mă pupe, să mă fută și să mă facă al lui 🔥</p>
        
        <p style="font-size: 2.6rem; margin: 40px 0;">
            <span class="heart">❤️</span> Darius, te vreau rău de tot <span class="heart">💦</span>
        </p>
        
        <footer style="margin-top: 50px; opacity: 0.9;">
            Made with 🔥 pentru Teo
        </footer>
    </div>
</body>
</html>
